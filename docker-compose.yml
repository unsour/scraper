services:
  scrapling:
    build: .
    container_name: scrapling
    volumes:
      - ./scripts:/app/scripts
      - ./output:/app/output
    working_dir: /app
    stdin_open: true
    tty: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/scripts
